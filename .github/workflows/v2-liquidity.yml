name: V2 liquidity qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-liquidity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @retropick/retro-ui exec playwright install --with-deps chromium
      - run: python3 scripts/launchpad/verify_liquidity.py --browser --evidence /tmp/v2-liquidity-ci
      - name: Retain qualification evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-liquidity-ci-evidence
          path: /tmp/v2-liquidity-ci
          retention-days: 7

  solidity-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      FOUNDRY_PROFILE: test
      EVIDENCE_DIR: ${{ runner.temp }}/v2-solidity-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0 # Archive verifiers compare original deployed and regression Git blobs.
      - id: foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
      - name: Record compiler and source identity
        working-directory: contracts
        run: |
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-sha.txt"
          forge --version > "$EVIDENCE_DIR/foundry-version.txt"
          forge config --json | python3 -c 'import json,sys; c=json.load(sys.stdin); print(json.dumps({k:c.get(k) for k in ("solc", "evm_version", "optimizer", "optimizer_runs", "via_ir", "chain_id", "code_size_limit")}, indent=2))' > "$EVIDENCE_DIR/compiler-settings.json"
      - name: V2 unit and fuzz cases
        id: unit
        if: ${{ !cancelled() && steps.foundry.outcome == 'success' }}
        working-directory: contracts
        run: |
          mkdir -p "$EVIDENCE_DIR"
          forge test --contracts src/v2 --match-path 'test/v2/unit/*.t.sol' --fuzz-seed 0x6a -vvv 2>&1 | tee "$EVIDENCE_DIR/unit.log"
      - name: V2 stateful invariants
        id: invariants
        if: ${{ !cancelled() && steps.foundry.outcome == 'success' }}
        working-directory: contracts
        env:
          FOUNDRY_INVARIANT_RUNS: '256'
          FOUNDRY_INVARIANT_DEPTH: '128'
        run: |
          mkdir -p "$EVIDENCE_DIR"
          forge test --contracts src/v2 --match-path 'test/v2/invariant/*.t.sol' --fuzz-seed 0x6a -vvv 2>&1 | tee "$EVIDENCE_DIR/invariants.log"
      - name: Community Treasury six-decimal stateful invariants
        id: treasury_usdc
        if: ${{ !cancelled() && steps.foundry.outcome == 'success' }}
        working-directory: contracts
        env:
          FOUNDRY_INVARIANT_RUNS: '256'
          FOUNDRY_INVARIANT_DEPTH: '128'
        run: |
          mkdir -p "$EVIDENCE_DIR"
          forge test --contracts src/v2 --match-path 'test/v2/community-economy/treasury-integration/CommunityTreasuryUSDCInvariant.t.sol' --fuzz-seed 0x6a -vvv 2>&1 | tee "$EVIDENCE_DIR/treasury-usdc.log"
      - name: Community Treasury successful V4 behavior seam (native and six-decimal)
        id: treasury_v4
        if: ${{ !cancelled() && steps.foundry.outcome == 'success' }}
        working-directory: contracts
        run: |
          mkdir -p "$EVIDENCE_DIR"
          forge test --contracts src/v2 --match-path 'test/v2/community-economy/treasury-integration/CommunityTreasuryV4Seam.t.sol' --fuzz-seed 0x6a -vvv 2>&1 | tee "$EVIDENCE_DIR/treasury-v4-seam.log"
      - name: Frozen legacy source and custody-policy regression
        id: legacy
        if: ${{ !cancelled() && steps.foundry.outcome == 'success' }}
        working-directory: contracts
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python3 legacy-v2/verify.py 2>&1 | tee "$EVIDENCE_DIR/deployed-legacy-source.log"
          python3 legacy/v2-kuru/verify.py 2>&1 | tee "$EVIDENCE_DIR/legacy-boundary.log"
          forge test --contracts src/legacy/v2/kuru/canonical --match-path 'test/legacy/v2-kuru/unit/*.t.sol' --fuzz-seed 0x6a -vvv 2>&1 | tee "$EVIDENCE_DIR/legacy-unit.log"
      - name: Require every Solidity qualification suite
        if: ${{ always() }}
        env:
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
          TREASURY_USDC_OUTCOME: ${{ steps.treasury_usdc.outcome }}
          TREASURY_V4_OUTCOME: ${{ steps.treasury_v4.outcome }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python3 - <<'PYTHON'
          import json, os, pathlib
          outcomes = {name: os.environ.get(name, "missing") for name in (
              "UNIT_OUTCOME", "INVARIANTS_OUTCOME", "TREASURY_USDC_OUTCOME", "TREASURY_V4_OUTCOME", "LEGACY_OUTCOME")}
          pathlib.Path(os.environ["EVIDENCE_DIR"], "suite-outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
          print(json.dumps(outcomes))
          if any(result != "success" for result in outcomes.values()):
              raise SystemExit("Every mandatory Solidity suite must succeed; failures, cancellations and skips block qualification")
          PYTHON
      - name: Retain Solidity qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-solidity-ci-evidence
          path: ${{ runner.temp }}/v2-solidity-evidence
          retention-days: 14
          if-no-files-found: error
