[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
  "deployment-periphery/=../lib/v4-deployment-periphery/",
  "@uniswap/v4-core/=../lib/v4-deployment-periphery/lib/v4-core/",
  "openzeppelin-contracts/=../lib/v4-deployment-periphery/lib/v4-core/lib/openzeppelin-contracts/",
  "solmate/=../lib/v4-deployment-periphery/lib/v4-core/lib/solmate/",
  "permit2/=../lib/v4-deployment-periphery/lib/permit2/"
]
