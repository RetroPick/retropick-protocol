[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Solidity compiler settings
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Uniswap V4 transient storage requirements
fs_permissions = [{ access = "read-write", path = "./"}]

[profile.ci]
optimizer_runs = 1000

# Test/script harnesses embed or load complete deployments. Runtime artifact gates remain EIP-170 strict.
[profile.test]
chain_id = 10143
network = "monad"
code_size_limit = 1048576

[profile.release_script]
code_size_limit = 1048576

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
# Add RPC endpoints as needed

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
