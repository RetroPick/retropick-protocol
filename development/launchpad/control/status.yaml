    next_owner: launchpad-integrations
  - id: BLOCK-ARCH-ADRS
    reason: Full-stack workspace, backend, indexer, auth, storage, admin, upgradeability and V4-retirement choices are PROPOSED rather than accepted.
    next_owner: launchpad-planner
  - id: BLOCK-FULLSTACK
    reason: apps/web has a mock-driven product prototype, not live Launchpad Core execution; apps/api, apps/indexer and shared runtime SDK/contracts packages are not implemented.
    next_owner: launchpad-planner
