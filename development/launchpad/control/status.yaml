    status: blocked
    scope: native_MON_and_chain_10143_Circle_USDC_only
    evidence: evidence/launchpad/core/dev4-core-quote-invariant-increment-2026-09-30.md
    reason: Factory sender-loss guard, pinned Circle launch/buy/sweep, supported-asset near-graduation fold-back, repeated buyback sweeps with partial/full vesting, default Curve stateful campaign, and native/Circle V4 success/failure/retry/replay behavior now pass; Factory extraction/code-size qualification, broader Factory/escrow/custody stateful coverage, and an accepted generic graduation-completion ceiling remain incomplete.
  KURU_TARGET_DEV_FROZEN:
    status: blocked
    evidence: evidence/launchpad/kuru/kuru-benchmark-gates-2026-09-30.yaml
    reason: Two-raw-unit buy/sell cycles repeatably pump terminal Q, so unrestricted LaunchConfig alone cannot establish the candidate Kuru envelope. A venue-agnostic exact completion-quote ceiling is modeled and differentially sampled; reduced-model sufficient bounds cover ten isolated candidate wide-Q profiles through their conservative sufficient-condition endpoints, but those endpoints are not accepted ceilings or exact mathematical maxima, and no production guard, continuous P0 LaunchConfig envelope or real-fork boundary qualification exists. B1 and B5-B10 now pass only in the pinned research-fixture domain; B2-B4 require owner/economic decisions. Factory extraction, Core integration and ADR-009/011/021/022/023 acceptance remain blockers; live B11/B12 are post-development gates.
  KURU_LIVE_TESTNET_QUALIFIED:
    status: blocked
    evidence: evidence/launchpad/kuru/live-actor-funding-readonly-2026-09-30.md
    reason: No real Core-to-Kuru graduation or two-party market usability transaction has been sent; this is a post-DEV-4 staging prerequisite.
  CORE_BASELINE_QUALIFIED:
    status: blocked
    evidence: evidence/launchpad/core/dev4-core-quote-invariant-increment-2026-09-30.md
    reason: Production FeeEscrow, Curve and Factory exact quote guards reject tested sender-surcharge accounting paths; external balance loss fails closed. Fixed P0 quote identity, pinned Circle launch/buy/sweep, default Curve invariants and supported-asset V4 graduation behavior pass, but Factory extraction/code-size qualification and the broader Factory/escrow/custody invariant matrix remain open. Factory has only 11 bytes EIP-170 margin.
  KURU_TARGET_FROZEN:
    status: blocked
    evidence: evidence/launchpad/kuru/kuru-benchmark-gates-2026-09-30.yaml
    reason: KURU_TECHNICAL_BENCHMARK passes only in the pinned research-fixture domain: B1 and B5-B10 cover environment, real deploy/seed, bound custody, retry/replay, observable drift and deterministic gas. B2/B3/B4 remain DECISION_REQUIRED for quote policy and the accepted terminal-Q/parameter/seed envelope; B11/B12 remain NOT_RUN. ADR-009/011/021/022/023 are not accepted, so the target is not frozen.
  READY_FOR_DEV4_KURU_EXECUTOR:
    status: blocked
    reason: CORE_BASELINE_P0_QUALIFIED and KURU_TARGET_DEV_FROZEN are blocked; ADR-009/011/021/022/023 remain PROPOSED. Live-testnet qualification is a later staging gate, not an excuse to promote DEV-4 early.
blockers:
