    reason: Core V2 math, Factory/Deployer launch, production FeeEscrow, direct Curve/Token accounting, default native Curve stateful coverage, authority, native and Circle near-graduation fold-back plus repeated buyback sweeps/vesting, Factory V4 sender-loss rejection, pinned Circle launch/buy/sweep, and native/Circle V4 success/failure/retry/replay behavior pass within their declared domains. Factory extraction/code-size qualification and broader Factory/escrow/custody stateful invariants remain open; any remaining FeeEscrow or accepted-P0 post-graduation-hook gap must be named specifically.
    next_owner: launchpad-solidity
  - id: BLOCK-KURU-TARGET
    reason: Pinned live environment, real Router/Vault deploy/seed, bound LP/excess custody, staged failure retry/replay, observable drift rejection and deterministic MON/Circle gas rows now pass in the research fixture. Repeatable terminal-Q drift invalidates threshold-only prelaunch admission; the proposed exact completion-ceiling guard and ten-profile wide-Q sufficient endpoint coverage are research-only and are not accepted economic ceilings. Continuous P0 admission, the owner quote/parameter/seed decisions, Factory/Core integration and ADR acceptance remain unresolved. Target is not frozen; live B11/B12 belong to later staging qualification.
    next_owner: launchpad-integrations
  - id: BLOCK-ARCH-ADRS
    reason: Full-stack workspace, backend, indexer, auth, storage, admin, upgradeability and V4-retirement choices are PROPOSED rather than accepted.
    next_owner: launchpad-planner
