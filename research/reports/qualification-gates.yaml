contradiction_2_resolved_redeem: "recorded_contradiction. Open. ADR-P10 PROPOSED. Acceptance not granted. BinaryCompleteSetMarket.redeem pays 1 while RESOLVED and moves collateral from 4 to 3. PredictionMarket.redeem raises redeem only while REDEEMABLE and leaves collateral at 4. Neither redeem was edited. Not a theorem pass. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/resolved-redeem-contradiction-2026-09-26.json."
ADR-P10: "PROPOSED. Acceptance not granted. Keep the prediction lifecycle separation. Leave native_market.py as the reduced oracle. Do not edit either redeem until acceptance. Contradiction 2 stays open. Evidence evidence/research/prediction/resolved-redeem-contradiction-2026-09-26.json."
false_return_collateral: "recorded_contradiction. Open. ADR-P08 PROPOSED. Acceptance not granted. create_market rejects CollateralClass.FALSE_RETURN before any transfer. Solidity constructs and activates the market. transfer and transferFrom return false. split(1) reverts SafeERC20FailedOperation. collateralLocked, yesSupply, and noSupply stay 0. Implementations unchanged. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/false-return-collateral-2026-09-26.json."
ADR-P08: "PROPOSED. Acceptance not granted. Recommends rejecting false-return collateral before activation. The kernel must not be edited until acceptance. Contradiction stays open. Evidence evidence/research/prediction/false-return-collateral-2026-09-26.json."
rebasing_collateral: "COUNTEREXAMPLE_FOUND. create_market rejects CollateralClass.REBASING. The kernel has no rebase function. Test-only rebaseDown after split(100) leaves collateral balance 99, collateralLocked 100, yesSupply 100, noSupply 100, liability 100. ADR-P06 stays PROPOSED. ADR-P09 PROPOSED. Acceptance not granted. Implementations unchanged. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/rebasing-collateral-2026-09-26.json."
ADR-P09: "PROPOSED. Acceptance not granted. The kernel must not treat collateralLocked as equal to the rebasing token balance. The counterexample stays COUNTEREXAMPLE_FOUND. The kernel must not be edited until acceptance. Evidence evidence/research/prediction/rebasing-collateral-2026-09-26.json."
split_callback: "existing_guard. nonReentrant. Inner split during transferFrom reverts ReentrancyGuardReentrantCall and that revert is the outer split. collateral balance 0, collateralLocked 0, yesSupply 0, noSupply 0. Python ERC777 is rejected at construction and has no token callback. Nested split raises reentrancy and leaves supplies at 0. No new guard. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/split-callback-2026-09-26.json."
live_collateral_withdrawal: "existing_rule. After split(4), cancelDraft, archive, redeemYes, redeemNo, and merge from factory, resolver, and an arbitrary address revert and leave balance 4, collateralLocked 4, yesSupply 4, noSupply 4. Holder merge(1) burns both sides first and leaves 3. Holder redeemYes(1) burns YES first and leaves balance 2, collateralLocked 2, yesSupply 2, noSupply 3. Python admin_withdraw leaves 4. No withdraw function was added. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/live-collateral-withdrawal-2026-09-26.json."
double_yes_redeem: "existing_rule. After split(4), YES_WIN, and open redemption, the first redeem of YES 4 pays 4 and leaves collateral 0, YES supply 0, holder YES 0, NO supply 4. Python second redeem raises redeem exceeds balance. Solidity second redeemYes(4) reverts ERC20InsufficientBalance. Collateral does not fall twice. Redeem and resolve were not changed. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/double-yes-redeem-2026-09-26.json."
second_yes_resolution: "existing_rule. After split(4) and YES_WIN, a second resolve to NO_WIN reverts. Python raises illegal transition RESOLVED -> RESOLVED. Solidity reverts BadState. Numerators stay 2 and 0. Collateral, YES supply, and NO supply stay 4. Resolve was not changed. MATH-1 stays FAIL. PRED-MATH-1 stays partial. PRED-CONTRACT-1 stays not_pass. Log evidence/research/prediction/second-yes-resolution-2026-09-26.json."

